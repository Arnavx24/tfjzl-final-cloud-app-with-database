{% extends 'onlinecourse/base.html' %}

{% block title %}Login - Online Course{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="font-weight-bold mb-0"><i class="fas fa-sign-in-alt mr-2"></i>Sign In</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'onlinecourse:login' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_username"><b>Username</b></label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label for="id_password"><b>Password</b></label>
                        <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
                        Sign In
                    </button>
                </form>
                <div class="text-center mt-3">
                    <p class="text-muted">Don't have an account? <a href="{% url 'onlinecourse:registration' %}">Sign up here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
